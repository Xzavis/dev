<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>New Contact from Messi</title>
  <style>
    :root { color-scheme: light dark; }
    .bg-main { background-color: #ffffff; }
    .bg-card { background-color: #ffffff; }
    .bg-inner { background-color: #f4f4f5; }
    .border-card { border-color: #e4e4e7; }
    .text-main { color: #09090b; }
    .text-muted { color: #52525b; }
    .text-label { color: #71717a; }
    .btn-owner { background-color: #09090b; color: #ffffff; border-color: #09090b; }
    @media (prefers-color-scheme: dark) {
      .bg-main { background-color: #09090b !important; }
      .bg-card { background-color: #0e0e11 !important; }
      .bg-inner { background-color: #16161a !important; }
      .border-card { border-color: #27272a !important; }
      .text-main { color: #ffffff !important; }
      .text-muted { color: #a1a1aa !important; }
      .text-label { color: #71717a !important; }
      .btn-owner { background-color: #ffffff !important; color: #09090b !important; border-color: #ffffff !important; }
    }
  </style>
</head>
<body class="bg-main text-main" style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" class="bg-main" style="padding:40px 0;">
    <tr><td align="center">
      <table width="580" cellpadding="0" cellspacing="0" style="margin:0 auto;">
        <!-- Header -->
        <tr>
          <td style="padding:32px 36px 24px;">
            <p class="text-label" style="margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">Portfolio Contact</p>
            <h1 class="text-main" style="margin:6px 0 0;font-size:24px;font-weight:600;letter-spacing:-0.5px;">New message received</h1>
          </td>
        </tr>
        <!-- Details & Message -->
        <tr>
          <td style="padding:0 36px;">
            <span class="text-label" style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px;">Pesan Masuk</span>
            <table width="100%" cellpadding="0" cellspacing="0" class="bg-inner border-card" style="border-width:1px;border-style:solid;border-radius:12px;overflow:hidden;">
              <tr>
                <td class="border-card" style="padding:16px 20px;border-bottom-width:1px;border-bottom-style:solid;">
                  <p class="text-main" style="margin:0;font-size:14px;"><strong>From:</strong> Messi &lt;<a href="mailto:messi@example.com" class="text-main" style="text-decoration:none;">messi@example.com</a>&gt;</p>
                </td>
              </tr>
              <tr>
                <td class="border-card" style="padding:16px 20px;border-bottom-width:1px;border-bottom-style:solid;">
                  <p class="text-main" style="margin:0;font-size:14px;"><strong>Subject: Ajakan Nongkrong di Tembalang</strong></p>
                </td>
              </tr>
              <tr>
                <td style="padding:20px;">
                  <div class="text-main" style="font-size:14px;line-height:1.6;white-space:pre-wrap;">Halo Bang, kenalin aku Messi. Aku pengen ajak nongkrong di Tembalang, Bang. Hubungi gw di 7685286532, kita atur jadwal.</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Action Button -->
        <tr>
          <td style="padding:24px 36px 32px;" align="left">
            <a href="mailto:messi@example.com?subject=Re: Ajakan%20Nongkrong%20di%20Tembalang" class="btn-owner" style="display:inline-block;text-decoration:none;font-size:13px;font-weight:600;padding:12px 24px;border-radius:8px;border-width:1px;border-style:solid;transition:opacity 0.2s;">Reply to Sender</a>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:24px 36px;text-align:center;">
            <p class="text-muted" style="margin:0;font-size:11px;font-family:monospace;">Sent via https://www.zickrian.dev</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
